apiVersion: v1
kind: Namespace
metadata:
  name: dbaas-providers
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: dbaas-providers
data:
  init.sql: |
    CREATE USER "root" WITH ENCRYPTED PASSWORD 'password' CREATEDB CREATEROLE;
    ALTER DATABASE "postgres" OWNER TO "root";
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mariadb
  namespace: dbaas-providers
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mariadb
  template:
    metadata:
      labels:
        app: mariadb
    spec:
      containers:
      - name: mariadb
        image: mariadb:10.4.12
        imagePullPolicy: IfNotPresent
        env:
        - name: MYSQL_DATABASE
          value: "db"
        - name: MYSQL_USER
          value: "user"
        - name: MYSQL_PASSWORD
          value: "password"
        - name: MYSQL_ROOT_PASSWORD
          value: "password"
        ports:
        - containerPort: 3306
---
apiVersion: v1
kind: Service
metadata:
  name: mariadb
  namespace: dbaas-providers
spec:
  selector:
    app: mariadb
  ports:
  - port: 3306
    targetPort: 3306
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mariadb-multi
  namespace: dbaas-providers
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mariadb-multi
  template:
    metadata:
      labels:
        app: mariadb-multi
    spec:
      containers:
      - name: mariadb-multi
        image: mariadb:10.4.12
        imagePullPolicy: IfNotPresent
        env:
        - name: MYSQL_DATABASE
          value: "db"
        - name: MYSQL_USER
          value: "user"
        - name: MYSQL_PASSWORD
          value: "password"
        - name: MYSQL_ROOT_PASSWORD
          value: "password"
        ports:
        - containerPort: 3306
---
apiVersion: v1
kind: Service
metadata:
  name: mariadb-multi
  namespace: dbaas-providers
spec:
  selector:
    app: mariadb-multi
  ports:
  - port: 3306
    targetPort: 3306
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: dbaas-providers
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15
        imagePullPolicy: IfNotPresent
        env:
        - name: POSTGRES_PASSWORD
          value: "password"
        - name: POSTGRES_USER
          value: "postgres"
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: init
          mountPath: /docker-entrypoint-initdb.d
      volumes:
      - name: init
        configMap:
          name: postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: dbaas-providers
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: dbaas-providers
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
      - name: mongodb
        image: mongo:9.0.4
        imagePullPolicy: IfNotPresent
        env:
        - name: MONGO_INITDB_ROOT_USERNAME
          value: "root"
        - name: MONGO_INITDB_ROOT_PASSWORD
          value: "password"
        ports:
        - containerPort: 27017
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: dbaas-providers
spec:
  selector:
    app: mongodb
  ports:
  - port: 27017
    targetPort: 27017
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-tls
  namespace: dbaas-providers
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb-tls
  template:
    metadata:
      labels:
        app: mongodb-tls
    spec:
      containers:
      - name: mongodb-tls
        image: dbaas-test/mongotls:test
        imagePullPolicy: IfNotPresent
        env:
        - name: MONGO_INITDB_ROOT_USERNAME
          value: "root"
        - name: MONGO_INITDB_ROOT_PASSWORD
          value: "password"
        ports:
        - containerPort: 27017
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-tls
  namespace: dbaas-providers
spec:
  selector:
    app: mongodb-tls
  ports:
  - port: 27017
    targetPort: 27017
---
apiVersion: v1
kind: Service
metadata:
  name: azure-mariadb
  namespace: dbaas-providers
spec:
  type: ExternalName
  externalName: mariadb.dbaas-providers.svc.cluster.local
---
apiVersion: v1
kind: Service
metadata:
  name: a-very-very-long-hostname-for-azure-mariadb-xxxxxxxxxxxxxxxxxx
  namespace: dbaas-providers
spec:
  type: ExternalName
  externalName: mariadb.dbaas-providers.svc.cluster.local
